spring.application.name=shopkart-backend
server.port=8080

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/shopkart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# 256-bit+ secret used to sign tokens. Change this for production and keep it out of source control.
app.jwt.secret=ChangeThisToALongRandomSecretKeyAtLeast32BytesForHS256Signing!!
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
# Comma-separated list of origins allowed to call this API (React dev server / static HTML preview)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,null
